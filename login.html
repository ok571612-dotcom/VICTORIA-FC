<!DOCTYPE html>
<html>
<head>
<title>Victoria FC Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#000;
  color:white;
  font-family:Arial;
  padding:20px;
}

.box{
  max-width:350px;
  margin:auto;
  margin-top:50px;
  background:#111;
  padding:20px;
  border-radius:15px;
}

h1{
  color:red;
  text-align:center;
}

input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button{
  background:red;
  color:white;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>VICTORIA FC</h1>
<h3>Admin Login</h3>

<input id="email" placeholder="Admin Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

</div>


<script type="module" src="login.js"></script>

</body>
</html>
