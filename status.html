<!DOCTYPE html>
<html>
<head>
  <title>Victoria FC - Application Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      max-width: 400px;
      margin: 60px auto;
      background: #111;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: red;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    button {
      background: red;
      color: white;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>VICTORIA FC</h1>

  <h3>Application Status</h3>

  <input
    id="applicationId"
    placeholder="Enter Application ID"
  >

  <button onclick="checkStatus()">
    Check Status
  </button>

  <div id="result"></div>

</div>

<script type="module" src="status.js"></script>

</body>
</html>
