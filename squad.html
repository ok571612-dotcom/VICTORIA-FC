<!DOCTYPE html>
<html>
<head>
  <title>Victoria FC - Squad</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 0, 0, 0.16), transparent 35%),
        #000;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 130px;
      max-width: 45%;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.35));
    }

    h1 {
      margin: 10px 0 5px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .player {
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid #292929;
      border-left: 4px solid red;
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0;
      box-shadow: 0 5px 20px rgba(255, 0, 0, 0.08);
    }

    .name {
      font-size: 21px;
      font-weight: bold;
    }

    .info {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .position {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #222;
      color: #ff3030;
      font-size: 12px;
      font-weight: bold;
    }

    .role {
      display: inline-block;
      margin-top: 10px;
      margin-right: 5px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #181818;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 50px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #999;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: red;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <img
      src="logo.png"
      class="logo"
      alt="Victoria FC Logo"
    >

    <h1>VICTORIA FC</h1>

    <div class="subtitle">
      OFFICIAL SQUAD
    </div>

  </div>

  <div id="players">

    <div class="empty">
      Loading squad...
    </div>

  </div>

  <a href="index.html" class="back">
    ← Back to Home
  </a>

</div>

<script type="module" src="squad.js"></script>

</body>
</html>
