<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Victoria FC — Squad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#050505;--panel:#0d0d10;--red:#ff1838;--red2:#c90e2b;--text:#f5f5f5;--muted:#a1a1a7;--line:rgba(255,35,60,.22)}
html{scroll-behavior:smooth}body{font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 50% 38%,#19070b 0,#080607 38%,#030303 76%);color:var(--text);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
a{text-decoration:none;color:inherit}.container{width:min(1120px,calc(100% - 30px));margin:auto}
.nav{height:58px;margin-top:14px;border:1px solid var(--line);border-radius:15px;background:rgba(9,9,10,.78);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;position:sticky;top:12px;z-index:20}.brand{font-weight:900;letter-spacing:1px;font-size:20px}.brand span{color:#e31a36}.navlinks{display:flex;align-items:center;gap:27px;font-size:11px;font-weight:800}.navlinks a{opacity:.9}.navlinks a:hover{color:#ff3651}.ig{border-left:1px solid rgba(255,255,255,.12);padding-left:18px;font-size:17px}
.hero{min-height:650px;display:grid;place-items:center;text-align:center;position:relative;padding:70px 0 35px}.hero:before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(235,17,45,.22),transparent 67%);filter:blur(8px)}
.hero-content{position:relative;z-index:2}.kicker{font-size:10px;letter-spacing:4px;color:#c8c8ca;font-weight:800;margin-bottom:18px}h1{font-size:clamp(62px,10vw,110px);line-height:.9;letter-spacing:-6px;font-weight:900}h1 span{display:block;color:#f01939;font-size:.65em;letter-spacing:-3px;margin-top:12px}.hero p{max-width:620px;color:#c5c5c8;font-size:13px;line-height:1.7;margin:28px auto}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid #8e1628;background:rgba(10,10,11,.75);color:white;border-radius:11px;padding:13px 24px;font-size:10px;font-weight:900;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(255,20,50,.22);border-color:#ff2747}.btn.primary{background:linear-gradient(135deg,#ff2947,#d70e2b);border-color:#ff5268;box-shadow:0 0 28px rgba(255,20,50,.22)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 0 55px}.stat{background:linear-gradient(145deg,rgba(24,24,26,.92),rgba(10,10,11,.88));border:1px solid var(--line);border-radius:18px;padding:27px 20px;text-align:center}.stat b{display:block;color:#f51d3d;font-size:26px;margin-bottom:8px}.stat span{font-size:10px;color:#ddd;line-height:1.5;font-weight:800}
section{padding:70px 0}.section-title{font-size:35px;letter-spacing:-1.5px;margin-bottom:10px}.section-sub{color:var(--muted);font-size:13px;margin-bottom:25px}.panel{background:#0c0c0e;border:1px solid rgba(255,45,70,.18);border-radius:20px;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{padding:10px 16px;border:1px solid #29292e;border-radius:9px;background:#09090a;color:#999;font-size:10px;font-weight:900;cursor:pointer}.tab.active{background:#d91531;border-color:#ff4560;color:#fff}
.pitch-wrap{display:grid;grid-template-columns:1fr 250px;gap:18px}.pitch{position:relative;min-height:560px;border:2px solid rgba(255,255,255,.3);border-radius:16px;background:linear-gradient(90deg,rgba(20,105,42,.35),rgba(10,70,28,.28));overflow:hidden}.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.22)}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:125px;height:125px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.22);border-radius:50%}.goal{position:absolute;left:50%;transform:translateX(-50%);width:150px;height:62px;border:2px solid rgba(255,255,255,.22)}.goal.top{top:-2px}.goal.bottom{bottom:-2px}.line{position:absolute;left:0;right:0;border-top:2px solid rgba(255,255,255,.18)}.line.mid{top:50%}.box{position:absolute;left:50%;transform:translateX(-50%);width:270px;height:115px;border:2px solid rgba(255,255,255,.2)}.box.top{top:-2px}.box.bottom{bottom:-2px}.slot{position:absolute;transform:translate(-50%,-50%);width:90px;text-align:center}.slot .shirt{margin:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#0d0d10;border:2px solid #ff2947;color:#fff;font-size:10px;font-weight:900;box-shadow:0 0 18px rgba(255,25,55,.25)}.slot small{display:block;margin-top:5px;font-size:9px;font-weight:900;text-shadow:0 1px 5px #000}.empty{opacity:.45}.side-info{display:flex;flex-direction:column;gap:12px}.role-card{background:#0b0b0d;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:17px}.role-card h3{font-size:10px;letter-spacing:1px;color:#ff3550;margin-bottom:10px}.role-player{font-weight:900;font-size:13px}.role-sub{font-size:10px;color:#888;margin-top:5px}.subs{display:flex;flex-wrap:wrap;gap:7px}.subpill{padding:7px 9px;background:#151518;border:1px solid #29292d;border-radius:99px;font-size:9px;color:#ddd}
.form-wrap{max-width:780px;margin:auto;background:#0c0c0e;border:1px solid var(--line);border-radius:20px;padding:26px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:9px;color:#aaa;font-weight:900;text-transform:uppercase;letter-spacing:1px}input,select{width:100%;background:#080809;border:1px solid #29292d;border-radius:10px;color:#fff;padding:12px;font:inherit;font-size:12px;outline:none}input:focus,select:focus{border-color:#d91a35;box-shadow:0 0 0 3px rgba(255,20,50,.08)}.choice-row{display:flex;gap:9px;flex-wrap:wrap}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;border:1px solid #29292e;background:#09090a;border-radius:9px;padding:11px 14px;color:#aaa;cursor:pointer;font-size:10px}.choice input:checked+label{border-color:#f32949;background:rgba(255,20,50,.1);color:#fff}.notice{margin-top:14px;color:#888;font-size:10px;line-height:1.6}.success{margin-top:15px;border:1px solid rgba(40,220,120,.25);background:rgba(40,220,120,.06);padding:13px;border-radius:10px;color:#b7ffd5;font-size:11px;display:none}
.status-box{max-width:620px;margin:auto}.status-result{margin-top:15px;background:#0c0c0e;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;font-size:12px;line-height:1.7;display:none}.status-result.show{display:block}.status-badge{display:inline-block;padding:5px 9px;border-radius:99px;background:rgba(255,180,0,.1);color:#ffc64a;font-size:9px;font-weight:900;margin-bottom:9px}.approved{background:rgba(53,216,137,.1);color:#55e99b}.rejected{background:rgba(255,30,55,.1);color:#ff657b}
footer{border-top:1px solid rgba(255,255,255,.07);padding:28px 0;color:#777;font-size:10px;text-align:center}
@media(max-width:820px){.pitch-wrap{grid-template-columns:1fr}.pitch{min-height:520px}.side-info{display:grid;grid-template-columns:1fr 1fr}.stats,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:600px){.navlinks{gap:10px}.navlinks a:not(.ig){display:none}.hero{min-height:590px}.crest{width:340px;height:340px}.side-info{grid-template-columns:1fr}.container{width:min(100% - 20px,1120px)}section{padding:52px 0}}
.ig{display:inline-flex;align-items:center;justify-content:center}.ig svg{width:22px;height:22px;display:block}.ig:hover{transform:translateY(-1px)}
</style></head><body><div class="container"><nav class="nav"><a href="index.html" class="brand">VICTORIA <span>FC</span></a><div class="navlinks"><a href="squad.html">SQUAD</a><a href="application.html">APPLICATION</a><a href="https://www.instagram.com/victori4_fc/" target="_blank" rel="noopener noreferrer" class="ig" aria-label="Official Victoria FC Instagram" title="@victori4_fc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg></a></div></nav><section id="squad"><div class="section-title">Squad</div><div class="section-sub">Choose a side to view the active formation and players.</div><div class="formation-name" style="margin:-12px 0 18px;color:#ff3550;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px">BALANCED</div><div class="panel"><div class="tabs"><button class="tab active" data-side="6a">6A SIDE</button><button class="tab" data-side="11a">11A SIDE</button></div><div class="pitch-wrap"><div class="pitch" id="pitch"><div class="goal top"></div><div class="goal bottom"></div><div class="box top"></div><div class="box bottom"></div><div class="line mid"></div></div><div class="side-info"><div class="role-card"><h3>CAPTAIN</h3><div class="role-player" id="captain">—</div><div class="role-sub">Team captain</div></div><div class="role-card"><h3>VICE CAPTAIN</h3><div class="role-player" id="vc">—</div><div class="role-sub">Vice captain</div></div><div class="role-card" style="grid-column:1/-1"><h3>STARTING PLAYERS</h3><div class="subs" id="startingPlayers">—</div></div><div class="role-card" style="grid-column:1/-1"><h3>SUBSTITUTES</h3><div class="subs" id="subs">—</div></div></div></div></div></section><footer>VICTORIA FC · OFFICIAL PORTAL · <a href="admin.html">ADMIN</a> · <span id="year"></span></footer></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC69Kn1QWhUhpGiAqMYs1o6Vrl4pgq10OA",authDomain:"victori4-fc.firebaseapp.com",projectId:"victori4-fc",storageBucket:"victori4-fc.firebasestorage.app",messagingSenderId:"337858940725",appId:"1:337858940725:web:4da5b6d8b841fd64d5467c",measurementId:"G-57SN4JXD8Z"};
const db=getFirestore(initializeApp(cfg)); const $=id=>document.getElementById(id);
const fallback={
 "6a":{attacking:{name:"Attacking",slots:[["GK",50,90],["DEF",25,68],["MID",50,50],["ATT",50,18],["ATT",78,28],["ATT",22,28]]},balanced:{name:"Balanced",slots:[["GK",50,90],["DEF",25,68],["MID",50,50],["ATT",50,18],["ATT",78,28],["ATT",22,28]]},defensive:{name:"Defensive",slots:[["GK",50,90],["DEF",25,68],["DEF",75,68],["MID",50,50],["MID",50,30],["ATT",50,15]]}},
 "11a":{attacking:{name:"Attacking",slots:[["GK",50,92],["RB",82,76],["CB",62,76],["LB",18,76],["CB",38,76],["CDM",50,58],["CM",35,44],["CAM",65,40],["RW",82,24],["LW",18,24],["ST",50,12]]},balanced:{name:"Balanced",slots:[["GK",50,92],["RB",82,76],["CB",50,78],["LB",18,76],["CB",38,76],["CDM",50,60],["CM",32,48],["CAM",68,48],["RW",82,28],["LW",18,28],["ST",50,14]]},defensive:{name:"Defensive",slots:[["GK",50,92],["RB",82,76],["CB",62,76],["LB",18,76],["CB",38,76],["CDM",35,58],["CDM",65,58],["CM",50,42],["RM",80,30],["LM",20,30],["ST",50,12]]}}
};
const empty={players:[],captain:"",vc:"",subs:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const [s,t]=await Promise.all([getDoc(doc(db,'squad','data')),getDoc(doc(db,'settings','public'))]);return {s:s.exists()?s.data():{six:empty,eleven:empty},t:t.exists()?t.data():{activeFormation:{'6a':'balanced','11a':'balanced'},formations:fallback,totalTeamMembers:0,matchPlayers6a:6,matchPlayers11a:8,bestPlayer:'MVP'}}}
async function render(side='6a'){
 const d=await load(), key=side==='6a'?'6a':'11a', s=d.s[key]||d.s[side]||empty;
 const active=d.t.activeFormation?.[key]||'balanced'; const f=(d.t.formations?.[key]?.[active])||fallback[key][active]||fallback[key].balanced;
 document.querySelectorAll('.formation-name').forEach(x=>x.textContent=f.name||active);
 const p=$('pitch'); p.querySelectorAll('.slot').forEach(x=>x.remove());
 (f.slots||[]).forEach((z,i)=>{const q=s.players?.[i]||{}, n=typeof q==='string'?q:q.name||'', pos=typeof q==='string'?'':q.pos||z[0]; const e=document.createElement('div');e.className='slot '+(!n?'empty':'');e.style.left=z[1]+'%';e.style.top=z[2]+'%';e.innerHTML='<div class="shirt">'+esc(n?n.split(' ').map(x=>x[0]).slice(0,2).join(''):'—')+'</div><small>'+esc(n||'OPEN')+'<br><span style="color:#ff6680;font-size:8px">'+esc(pos)+'</span></small>';p.appendChild(e)});
 $('captain').textContent=s.captain||'—'; $('vc').textContent=s.vc||'—';
 const excluded=new Set([s.captain,s.vc,...(s.subs||[]).map(x=>typeof x==='string'?x:x.name)]);
 const starters=(s.players||[]).filter(x=>{const n=typeof x==='string'?x:x.name;return n&&!excluded.has(n)});
 $('startingPlayers').innerHTML=starters.length?starters.map(x=>'<span class="subpill">'+esc(typeof x==='string'?x:x.name)+'<small style="display:block;color:#ff6680">'+esc(typeof x==='string'?'':x.pos||'')+'</small></span>').join(''):'—';
 $('subs').innerHTML=s.subs?.length?s.subs.map(x=>'<span class="subpill">'+esc(typeof x==='string'?x:x.name)+'</span>').join(''):'—';
 $('memberCount').textContent=d.t.totalTeamMembers??0; $('matchPlayers').textContent=(d.t.matchPlayers6a??6)+' / '+(d.t.matchPlayers11a??8); $('bestPlayer').textContent=d.t.bestPlayer||'MVP';
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.side)});document.getElementById('year').textContent=new Date().getFullYear();render('6a');
</script></body></html>
