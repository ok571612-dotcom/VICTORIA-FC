<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victoria FC — Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080a;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit} .wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#101014;border:1px solid #29292f;border-radius:18px;padding:22px;margin-bottom:18px}.login{max-width:430px;margin:10vh auto}.brand{font-weight:800;letter-spacing:2px}.muted{color:#999}.label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;margin:16px 0 8px;text-transform:uppercase}.input,.select{width:100%;padding:14px;border-radius:11px;border:1px solid #333;background:#08080a;color:#fff;outline:none}.input:focus,.select:focus{border-color:#e51b3e}.btn{border:0;border-radius:11px;padding:13px 17px;background:#e51b3e;color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#24242a}.btn.danger{background:#6e1425}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.hidden{display:none!important}.error{background:#3a1118;color:#ff9aaa;border:1px solid #7b2435;padding:11px;border-radius:10px;margin-top:12px}.success{background:#10331e;color:#9ff0b6;border:1px solid #25683a;padding:11px;border-radius:10px;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.player{border:1px solid #29292f;border-radius:12px;padding:12px;margin-top:10px}.player b{display:block}.small{font-size:12px;color:#aaa}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;background:#18181d;color:#ddd;border:1px solid #2b2b31;padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{border-color:#e51b3e;color:#fff}.check{display:flex;align-items:center;gap:8px;padding:10px 0}.check input{accent-color:#e51b3e}.dangerText{color:#ff8295}
</style>
</head>
<body>
<div id="loginView" class="wrap login">
  <div class="card">
    <div class="brand">VICTORIA FC</div>
    <h1>Admin Login</h1>
    <p class="muted">Sign in with the Firebase Admin account.</p>
    <label class="label">Email</label>
    <input id="email" class="input" type="email" autocomplete="username" placeholder="Admin email">
    <label class="label">Password</label>
    <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Admin password">
    <div style="height:14px"></div>
    <button id="loginBtn" class="btn" style="width:100%">Sign In</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="adminView" class="wrap hidden">
  <div class="top">
    <div><div class="brand">VICTORIA FC</div><div class="muted">Admin Panel</div></div>
    <button id="logoutBtn" class="btn secondary">Sign Out</button>
  </div>

  <div id="msg"></div>
  <div class="tabs">
    <button class="tab active" data-tab="settings">Settings</button>
    <button class="tab" data-tab="players">Squad / Players</button>
    <button class="tab" data-tab="lineup">Starting Players</button>
    <button class="tab" data-tab="applications">Applications</button>
  </div>

  <section id="settings" class="tabPage">
    <div class="card">
      <h2>6A Settings</h2>
      <label class="label">Formation</label>
      <select id="formation6" class="select">
        <option value="1-2-2-1">1-2-2-1</option><option value="1-3-2">1-3-2</option><option value="1-2-1-2">1-2-1-2</option><option value="custom">Custom</option>
      </select>
      <label class="label">Style</label>
      <select id="style6" class="select"><option value="balanced">Balanced</option><option value="attacking">Attacking</option><option value="defensive">Defensive</option><option value="custom">Custom</option></select>
      <label class="label">Custom Formation</label>
      <input id="custom6" class="input" placeholder="Example: 1-2-2-1">
      <div class="row" style="margin-top:14px"><button class="btn" id="save6">Save 6A Settings</button></div>
    </div>
    <div class="card">
      <h2>11A Settings</h2>
      <label class="label">Formation</label>
      <select id="formation11" class="select">
        <option value="1-4-4-2">1-4-4-2</option><option value="1-4-3-3">1-4-3-3</option><option value="1-4-2-3-1">1-4-2-3-1</option><option value="1-3-5-2">1-3-5-2</option><option value="1-3-4-3">1-3-4-3</option><option value="1-4-1-4-1">1-4-1-4-1</option><option value="1-4-5-1">1-4-5-1</option><option value="1-5-3-2">1-5-3-2</option><option value="custom">Custom</option>
      </select>
      <label class="label">Style</label>
      <select id="style11" class="select"><option value="balanced">Balanced</option><option value="attacking">Attacking</option><option value="defensive">Defensive</option><option value="custom">Custom</option></select>
      <label class="label">Custom Formation</label>
      <input id="custom11" class="input" placeholder="Example: 1-4-3-3">
      <div class="row" style="margin-top:14px"><button class="btn" id="save11">Save 11A Settings</button></div>
    </div>
  </section>

  <section id="players" class="tabPage hidden">
    <div class="card">
      <h2>Add / Edit Player</h2>
      <input id="playerId" type="hidden">
      <div class="grid">
        <div><label class="label">Full Name</label><input id="pName" class="input" placeholder="Player name"></div>
        <div><label class="label">Jersey Number</label><input id="pNumber" class="input" type="number" placeholder="24"></div>
        <div><label class="label">Side</label><select id="pSide" class="select"><option>6A</option><option>11A</option><option>BOTH</option></select></div>
        <div><label class="label">Position</label><select id="pPosition" class="select"></select></div>
        <div><label class="label">Role</label><select id="pRole" class="select"><option value="player">Player</option><option value="captain">Captain</option><option value="vc">Vice Captain</option><option value="substitute">Substitute</option></select></div>
        <div><label class="label">Starting</label><select id="pStarting" class="select"><option value="true">Yes</option><option value="false">No</option></select></div>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn" id="savePlayer">Save Player</button><button class="btn secondary" id="clearPlayer">Clear</button></div>
    </div>
    <div class="card"><h2>Players</h2><div id="playerList"><p class="muted">Loading...</p></div></div>
  </section>

  <section id="applications" class="tabPage hidden">
    <div class="card"><h2>Applications</h2><div id="applicationList"><p class="muted">Loading...</p></div></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC69Kn1QWhUhpGiAqMYs1o6Vrl4pgq10OA",
 authDomain:"victori4-fc.firebaseapp.com",
 projectId:"victori4-fc",
 storageBucket:"victori4-fc.firebasestorage.app",
 messagingSenderId:"337858940725",
 appId:"1:337858940725:web:4da5b6d8b841fd64d5467c",
 measurementId:"G-57SN4JXD8Z"
};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
const $=id=>document.getElementById(id);
const msg=(text,type='success')=>{$('msg').innerHTML=`<div class="${type}">${text}</div>`;setTimeout(()=>{$('msg').innerHTML=''},3500)};
const loginMsg=(text,type='error')=>{$('loginMsg').innerHTML=`<div class="${type}">${text}</div>`};

const pos6=['GK','DEF','MID','ATT'];
const pos11=['GK','RB','LB','CB','RWB','LWB','SW','CDM','CM','CAM','RM','LM','RW','LW','ST','CF','SS'];
function fillPositions(){ $('pPosition').innerHTML=[...pos6,...pos11.filter(x=>!pos6.includes(x))].map(x=>`<option value="${x}">${x}</option>`).join(''); }
fillPositions();

$('loginBtn').onclick=async()=>{
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password){loginMsg('Please enter both email and password.');return}
 $('loginBtn').disabled=true;$('loginBtn').textContent='Signing in...';
 try{await signInWithEmailAndPassword(auth,email,password);loginMsg('Signed in successfully.','success');}
 catch(e){
   const codes={"auth/invalid-credential":"Incorrect email or password.","auth/invalid-email":"Please enter a valid email address.","auth/user-not-found":"No Firebase user exists with this email.","auth/wrong-password":"Incorrect password.","auth/too-many-requests":"Too many attempts. Try again later.","auth/network-request-failed":"Network error. Check your internet connection."};
   loginMsg(codes[e.code]||`Login failed: ${e.code||e.message}`,'error');
 }finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Sign In'}
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{if(user){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');await loadSettings();await loadPlayers();await loadLineupPlayers();await loadApplications()}else{$('adminView').classList.add('hidden');$('loginView').classList.remove('hidden')}});

document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabPage').forEach(x=>x.classList.add('hidden'));btn.classList.add('active');$(btn.dataset.tab).classList.remove('hidden')});

const FORM6=['1-2-2-1','1-3-2','1-2-1-2'];
const FORM11=['1-4-4-2','1-4-3-3','1-4-2-3-1','1-3-5-2','1-3-4-3','1-4-1-4-1','1-4-5-1','1-5-3-2'];
async function loadSettings(){
 for(const side of ['6A','11A']){
  try{
   const s=await getDoc(doc(db,'settings',side));
   if(s.exists()){
    const d=s.data();
    $('formation'+side.slice(0,2)).value=d.formation|| (side==='6A'?FORM6[0]:FORM11[0]);
    $('custom'+side.slice(0,2)).value=d.customFormation||'';
    $('style'+side.slice(0,2)).value=d.style||'balanced';
   }
  }catch(e){console.warn(e)}
 }
}
async function saveSettings(side){
 const n=side==='6A'?'6':'11';
 try{
  await setDoc(doc(db,'settings',side),{formation:$('formation'+n).value,customFormation:$('custom'+n).value.trim(),style:$('style'+n).value,updatedAt:Date.now()},{merge:true});
  msg(`${side} settings saved.`);
 }catch(e){msg(`Could not save: ${e.message}`,'error')}
}
$('save6').onclick=()=>saveSettings('6A');
$('save11').onclick=()=>saveSettings('11A');

async function loadPlayers(){
 try{const snap=await getDocs(collection(db,'squad'));const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));
 $('playerList').innerHTML=arr.length?arr.map(p=>`<div class="player"><b>${esc(p.name||'Unnamed')} #${esc(p.number??p.jerseyNumber??'')}</b><div class="small">${esc(p.side||'')} • Position: ${esc(p.position||'')} • Role: ${esc(p.role||'player')} • Starting: ${p.starting?'Yes':'No'}</div><div class="row" style="margin-top:8px"><button class="btn secondary" onclick='window.editPlayer(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick='window.removePlayer(${JSON.stringify(p.id)})'>Delete</button></div></div>`).join(''):'<p class="muted">No players yet.</p>';
 }catch(e){$('playerList').innerHTML=`<div class="error">Could not load players: ${esc(e.message)}</div>`}
}
window.editPlayer=p=>{$('playerId').value=p.id||'';$('pName').value=p.name||'';$('pNumber').value=p.number??'';$('pSide').value=p.side||'6A';$('pPosition').value=p.position||'GK';$('pRole').value=p.role||'player';$('pStarting').value=String(p.starting??false);scrollTo({top:0,behavior:'smooth'})};
window.removePlayer=async id=>{if(!confirm('Delete this player?'))return;try{await deleteDoc(doc(db,'squad',id));msg('Player deleted.');await loadPlayers()}catch(e){msg(`Delete failed: ${e.message}`,'error')}};
$('clearPlayer').onclick=()=>{['playerId','pName','pNumber'].forEach(id=>$(id).value='');$('pSide').value='6A';$('pPosition').value='GK';$('pRole').value='player';$('pStarting').value='false'};
$('savePlayer').onclick=async()=>{const name=$('pName').value.trim(),number=$('pNumber').value.trim();if(!name||!number){msg('Player name and jersey number are required.','error');return}const id=$('playerId').value||crypto.randomUUID();try{await setDoc(doc(db,'squad',id),{name,number:Number(number),side:$('pSide').value,position:$('pPosition').value,role:$('pRole').value,starting:$('pStarting').value==='true',updatedAt:Date.now()},{merge:true});msg('Player saved.');$('clearPlayer').click();await loadPlayers()}catch(e){msg(`Save failed: ${e.message}`,'error')}};

async function loadLineupPlayers(){
 try{
  const snap=await getDocs(collection(db,'squad')); const arr=[];
  snap.forEach(d=>arr.push({id:d.id,...d.data()}));
  $('lineupPlayer').innerHTML=arr.map(p=>`<option value="${esc(p.id)}">${esc(p.name||'Unnamed')} #${esc(p.number??p.jerseyNumber??'')}</option>`).join('');
  updateLineupPositions(); await renderLineups(arr);
 }catch(e){msg(`Could not load lineup: ${e.message}`,'error')}
}
function updateLineupPositions(){
 const side=$('lineupSide').value;
 const list=side==='6A'?pos6:pos11;
 $('lineupPosition').innerHTML=list.map(x=>`<option value="${x}">${x}</option>`).join('');
}
$('lineupSide').onchange=updateLineupPositions;
$('lineupPlayer').onchange=()=>{
 const id=$('lineupPlayer').value; if(!id)return;
 getDoc(doc(db,'squad',id)).then(d=>{if(d.exists()){const p=d.data();if(p.position)$('lineupPosition').value=p.position;}});
};
$('saveLineup').onclick=async()=>{
 const id=$('lineupPlayer').value;if(!id){msg('Select a player.','error');return}
 try{
  await updateDoc(doc(db,'squad',id),{side:$('lineupSide').value,position:$('lineupPosition').value,role:$('lineupRole').value,starting:$('lineupRole').value==='starting'||$('lineupRole').value==='captain'||$('lineupRole').value==='vc',updatedAt:Date.now()});
  msg('Lineup assignment saved.'); await loadPlayers(); await loadLineupPlayers();
 }catch(e){msg(`Lineup save failed: ${e.message}`,'error')}
};
async function renderLineups(arr){
 const render=side=>arr.filter(p=>p.side===side||p.side==='BOTH').sort((a,b)=>String(a.position||'').localeCompare(String(b.position||''))).map(p=>`<div class="player"><b>${esc(p.position||'')} — ${esc(p.name||'Unnamed')} #${esc(p.number??p.jerseyNumber??'')}</b><div class="small">${esc(p.role||'player')} • ${p.starting?'Starting':'Not starting'}</div></div>`).join('')||'<p class="muted">No lineup players assigned.</p>';
 $('lineup6List').innerHTML=render('6A'); $('lineup11List').innerHTML=render('11A');
}

async function loadApplications(){try{const snap=await getDocs(collection(db,'applications'));const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));$('applicationList').innerHTML=arr.length?arr.map(a=>`<div class="player"><b>${esc(a.fullName||a.name||'Unnamed')}</b><div class="small">${esc(a.status||'pending')} • ${esc(a.phone||a.phoneNumber||'')} • ${esc(a.team||a.side||'')}</div><div style="margin-top:8px">${esc(a.position||'')}</div></div>`).join(''):'<p class="muted">No applications found.</p>'}catch(e){$('applicationList').innerHTML=`<div class="error">Could not load applications: ${esc(e.message)}</div>`}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
